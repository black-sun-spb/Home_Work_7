{% extends "catalog/base.html" %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
<div class="container">
    <h1>Удалить статью "{{ object.title }}"?</h1>
    <p>Вы уверены, что хотите удалить эту статью? Действие нельзя будет отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
        <a href="{% url 'blog:blog_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
